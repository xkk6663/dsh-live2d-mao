url: https://github.com/xkk6663/dsh-live2d-mao
name: xkk6663/dsh-live2d-mao
category: fun
description:
  en: 'A DSH-specialized Live2D desktop pet: a real skeletal Live2D model (PixiJS + Cubism 4) living in its own Electron window on your desktop, mirroring DeepSeek Harness work state through a 12-phase semantic bus - planning, thinking, executing-tool, streaming, waiting-input, awaiting-approval, complete, error. Ships tool-status bubbles, a token-by-token streaming strip, drag inertia, lock position, Shift-drag, opacity, and 8 built-in models including the DS whale girl. The plugin only pushes events; the pet window itself is a standalone program.'
  zh: 'DSH 专用 Live2D 桌宠：PixiJS + Cubism 4 真实骨骼动画，住在独立的 Electron 桌宠窗口里，通过 12 态语义总线实时映射 DeepSeek Harness 的工作状态——规划、思考中、执行工具、回复中、聆听中、待确认、完成、出错。带工具状态气泡、逐 token 流式横条、拖拽惯性、锁定位置、Shift 防误拖、不透明度可调，内置 8 款模型（含 DS 鲸鱼娘）。插件只推事件，桌宠窗口是独立程序。'
