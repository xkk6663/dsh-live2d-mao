url: https://github.com/xkk6663/dsh-live2d-mao
name: xkk6663/dsh-live2d-mao
category: fun
description:
  en: 'A Live2D desktop pet that mirrors DeepSeek Harness work state in real time. No API key, token or account: it reads only your local DSH session logs and plugin events, so it works the moment DSH is running and never calls a cloud endpoint. A real skeletal Live2D model (Cubism 4) lives in its own desktop window, driven by a 12-phase bus - planning, thinking, executing-tool, streaming, waiting-input, awaiting-approval, complete, error, paused, idle, heartbeat - so the animation, head badge and eye tracking all follow the actual turn, not a timer. Three independent channels: a tool-status bubble that names the tool in use, a token-by-token streaming strip that carries reply text with code highlighting and scrollback, and a head badge that changes colour per phase (each colour customisable). Plus drag with inertia, lock position, Shift-drag to avoid mis-taps, 10-100% opacity, 8 built-in models with per-model motion and expression slot binding, and 7 event sounds.'
  zh: '把 DeepSeek Harness 的工作状态实时变成桌面上的 Live2D 看板娘。不需要 API Key、token 或账号：只读本机 DSH 会话日志与插件事件，DSH 一跑起来就生效，不向任何云端端点发请求。真实骨骼动画（Cubism 4）住在独立桌宠窗口里，由 12 态总线驱动——规划、思考中、执行工具、回复中、聆听中、待确认、完成、出错、暂停、待机、在线，动画、头顶徽标与视线都跟着真实轮次走而不是定时器。三条独立通路：工具状态气泡直接点名正在用的工具；逐 token 流式横条承载回复正文，带代码高亮与历史滚动；头顶徽标按状态变色（每态颜色可自定义）。另有拖拽惯性、锁定位置、Shift 防误拖、10-100% 不透明度、8 款内置模型（支持逐模型绑定动作与表情槽位）和 7 类事件音效。'
