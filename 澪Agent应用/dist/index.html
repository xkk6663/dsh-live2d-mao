<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f9" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Mio</title>
    <!-- ================================================================
         本文件是 dist/index.html 的【模板】，由 scripts/compose-dist.mjs 渲染。
         三个 {{...}} 占位符由 compose-dist 从 dist-build/index.html 里取真实 hash 文件名填入：
           index-DXHDsGOF.js   vite 产出的入口 bundle（assets/index-<hash>.js）
           createLucideIcon-BPfB7xKW.js vite 产出的 modulepreload（assets/createLucideIcon-<hash>.js）
           index-C6UEaEBZ.css     vite 产出的样式表（assets/index-<hash>.css）
         其余 14 个手写注入 <script> 标签与 ?v= 版本参数【原样保留，勿让 vite 覆盖】。
         改了手写注入层文件 → 手动升它自己的 ?v=。
         ================================================================ -->
    <!-- 宿主注入（core-inject）：拦截原版已弃用 /api/agent/* 端点（防 404 / Not Found 提示条），必须最先同步执行 -->
    <script src="./core-inject/agent-kill-inject.js?v=20261013c"></script>
    <!-- 前端微内核：插件注册表（先于 manifest 注册与 plugin-nav 查询） -->
    <script src="./kernel/plugin-registry.js?v=20261015-p3b"></script>
    <!-- 插件 manifest（注册进 registry；导航/观察tab/体检条目由此聚合） -->
    <script defer src="./plugins/xiaozhi/manifest.js?v=20261015-p3b"></script>
    <script defer src="./plugins/dsh/manifest.js?v=20261015-p3"></script>
    <script defer src="./plugins/octop/manifest.js?v=20261015-p3"></script>
    <!-- 宿主注入：设置页收敛（隐藏原版已弃用的设置项/分类，只留桌宠分类） -->
    <script src="./core-inject/settings-clean-inject.js?v=20261013f"></script>
    <!-- 宿主注入：重建设置页（接管「设置」导航项，内嵌自有设置面板：资料/桌宠/语音/观察/提示词/小智/泡泡） -->
    <script src="./core-inject/settings-panel-inject.js?v=20261015a2"></script>
    <script type="module" crossorigin src="./assets/index-DXHDsGOF.js?v=20261016-m0"></script>
    <link rel="modulepreload" crossorigin href="./assets/createLucideIcon-BPfB7xKW.js">
    <link rel="stylesheet" crossorigin href="./assets/index-C6UEaEBZ.css?v=20261015-petfix1">
    <!-- 小智插件：图片提问（原版私人空间对话页注入 📷 上传按钮 + 粘贴图片，小智官方云视觉） -->
    <script defer src="./plugins/xiaozhi/chat-inject.js?v=20261016-imgbtn-right"></script>
    <!-- 小智插件：MCP 工具集中管理（左侧导航「小智工具」页） -->
    <script defer src="./plugins/xiaozhi/mcp-panel.js?v=20261013b"></script>
    <!-- DSH 插件：实时工作状态面板（左侧导航「DSH」页；只读本插件自己的 /api/plugin/dsh/*） -->
    <script defer src="./plugins/dsh/dsh-panel.js?v=20261015-dsh1"></script>
    <!-- 泡泡工坊渲染模块：供设置面板「泡泡」tab 调用（皮肤/点击互动/图片素材库；不再注入左侧导航） -->
    <script defer src="./core-inject/bubble-panel-inject.js?v=20261015-bp5"></script>
    <!-- 宿主注入：对话页右侧 rail 通用化（小智专属状态栏 → 跨 Agent 工具切换调用界面：收起态状态点 / 展开态完整面板） -->
    <script defer src="./core-inject/rail-switch-inject.js?v=20261016-rail"></script>
    <!-- 前端微内核：左侧导航插件化（固定导航 Agent→桌宠→设置 前置，插件导航按 manifest+enabled 动态显隐） -->
    <script defer src="./kernel/plugin-nav.js?v=20261015-p3"></script>
    <!-- 宿主注入：桌宠体检增强（接管 CompanionPage「体检」面板，插件条目按 manifest 聚合：小智/DSH/Octop + 本体自检） -->
    <script defer src="./core-inject/health-panel-inject.js?v=20261016-health"></script>
    <!-- 小智对话记录已内建于原版 ChatPage（对话页改造版），不再使用独立覆盖面板 -->
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
