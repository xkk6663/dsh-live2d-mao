<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f9" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Mio</title>
    <!-- ================================================================
         本文件是 dist/index.html 的【模板】，由 scripts/compose-dist.mjs 渲染。
         三个占位符由 compose-dist 从 dist-build/index.html 里取真实 hash 文件名填入：
           入口 bundle   ← vite 产出的 assets/index-<hash>.js
           modulepreload ← vite 产出的共享 chunk（**可选**：vite 的 chunk 图里没有
                           需要预载的共享 chunk 时它不产出这一行，compose-dist 会自动
                           把模板里对应的 <link rel="modulepreload"> 整行删掉）
           样式表        ← vite 产出的 assets/index-<hash>.css
         ⚠ 本注释里**故意不写占位符字面量**：compose-dist 渲染后会断言"占位符已全部
           被替换"，注释里留一份会让该断言在"modulepreload 缺失"时误报失败（踩过）。
         其余手写注入 <script> 标签与 ?v= 版本参数【原样保留，勿让 vite 覆盖】。
         改了手写注入层文件 → 手动升它自己的 ?v=。
         ================================================================ -->
    <!-- ================================================================
         ★ 插件市场（2026-10-25，契约 docs/插件市场-契约.md §3.1）
         可热插拔插件（dsh / feiyu / 将来的 market）**不再写死在本文件里**：
         由 kernel/plugin-loader.js 按 GET /api/plugin/market/catalog 的 entry/panel
         动态插 <script data-mio-plugin="...">。?v= 取清单里的 version，
         所以"改插件不用改 index.html"，启停/上架/下架也不必重启。
         本文件只保留三类东西：
           ① 宿主本体 builtin 插件（pet）的 manifest —— 宿主必须无条件在场；
           ② core-inject/** 宿主注入层；
           ③ kernel/** 微内核（registry → loader → nav）。
         ================================================================ -->
    <!-- 宿主注入（core-inject）：拦截原版已弃用 /api/agent/* 端点（防 404 / Not Found 提示条），必须最先同步执行 -->
    <script src="./core-inject/agent-kill-inject.js?v=20261013c"></script>
    <!-- 前端微内核：插件注册表（先于 manifest 注册与 plugin-nav 查询） -->
    <script src="./kernel/plugin-registry.js?v=20261025-market"></script>
    <!-- 前端微内核：插件动态加载器（按清单插 script；必须紧跟 registry、早于 plugin-nav）
         它异步抓清单，插件晚于 plugin-nav 落地属正常：nav 有 MutationObserver + 8s 轮询自愈，
         loader 每次 load/unload 完成后还会主动调 __mioPluginNav.refresh()。 -->
    <script src="./kernel/plugin-loader.js?v=20261026-hostnav"></script>
    <!-- 桌宠本体：内置插件（builtin=true，不可热插拔 —— 它就是宿主本身）
         宿主本体不依赖后端清单，必须无条件加载，所以仍写在此处 -->
    <script defer src="./plugins/pet/manifest.js?v=20261025-pet1"></script>
    <!-- 宿主注入：设置页收敛（隐藏原版已弃用的设置项/分类，只留桌宠分类） -->
    <script src="./core-inject/settings-clean-inject.js?v=20261013f"></script>
    <!-- 宿主注入：重建设置页（接管「设置」导航项，内嵌自有设置面板：资料/桌宠/语音/观察/提示词/小智/泡泡） -->
    <script src="./core-inject/settings-panel-inject.js?v=20261025-voicegone"></script>
    <script type="module" crossorigin src="./assets/index-CoS27ncO.js?v=20261016-m0"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CYmmBVuR.css?v=20261015-petfix1">
    <!-- 桌宠插件：设置页「桌宠」本体面板（形象/外观/交互 + 右键菜单同源操作）
         内置插件，恒可见；不提供启停入口。 -->
    <script defer src="./plugins/pet/pet-panel.js?v=20261025-theme"></script>
    <!-- 泡泡工坊渲染模块：供设置面板「泡泡」tab 调用（皮肤/点击互动/图片素材库；不再注入左侧导航） -->
    <script defer src="./core-inject/bubble-panel-inject.js?v=20261019-bp11"></script>
    <!-- 宿主注入：对话页右侧 rail 通用化（小智专属状态栏 → 跨 Agent 工具切换调用界面：收起态状态点 / 展开态完整面板） -->
    <script defer src="./core-inject/rail-switch-inject.js?v=20261026-subfilter"></script>
    <!-- 前端微内核：左侧导航插件化（固定导航 Agent→桌宠→设置 前置，插件导航按 manifest+enabled 动态显隐） -->
    <script defer src="./kernel/plugin-nav.js?v=20261025-fix4"></script>
    <!-- 宿主注入：桌宠体检增强（接管 CompanionPage「体检」面板，插件条目按 manifest 聚合 + 本体自检） -->
    <script defer src="./core-inject/health-panel-inject.js?v=20261016-health"></script>
    <!-- 小智对话记录已内建于原版 ChatPage（对话页改造版），不再使用独立覆盖面板 -->
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
