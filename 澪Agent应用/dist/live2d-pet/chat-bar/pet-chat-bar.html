<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桌宠对话</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:transparent; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    display:flex; align-items:center; padding:6px;
  }
  /* 一条胶囊横条：状态点 + 输入框 + 发图 + 发送 + 关闭 */
  .bar {
    position:relative; flex:1; display:flex; align-items:center; gap:8px;
    background:rgba(24,28,38,0.92);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:16px; padding:6px 7px 6px 12px;
    box-shadow:0 6px 22px rgba(0,0,0,0.30);
    -webkit-app-region: drag;   /* 空白区域可拖动窗口 */
  }
  .dot {
    width:8px; height:8px; border-radius:50%;
    background:#5ee08a; box-shadow:0 0 6px #5ee08a;
    flex:none; -webkit-app-region:no-drag;
  }
  .dot.connecting { background:#f5c26b; box-shadow:0 0 6px #f5c26b; }
  .dot.offline { background:#f0785e; box-shadow:0 0 6px #f0785e; }
  .bar input {
    flex:1; min-width:0;
    background:transparent; border:none; outline:none;
    color:#fff; font-size:14px; letter-spacing:0.3px;
    -webkit-app-region:no-drag;
  }
  .bar input::placeholder { color:rgba(255,255,255,0.42); }
  .ibtn {
    flex:none; width:30px; height:30px; border-radius:50%;
    border:none; cursor:pointer; font-size:14px;
    background:rgba(255,255,255,0.10); color:rgba(255,255,255,0.92);
    display:flex; align-items:center; justify-content:center;
    transition:background 0.15s;
    -webkit-app-region:no-drag;
  }
  .ibtn:hover { background:rgba(255,255,255,0.22); }
  .send {
    flex:none; border:none; cursor:pointer;
    background:linear-gradient(135deg,#4f6ef7,#7a5cf0);
    color:#fff; font-size:13px; font-weight:600;
    padding:7px 15px; border-radius:11px;
    -webkit-app-region:no-drag;
  }
  .send:disabled { opacity:0.45; cursor:default; }
  .close {
    position:absolute; top:-8px; right:-8px;
    width:18px; height:18px; border-radius:50%;
    border:none; cursor:pointer;
    background:rgba(40,44,56,0.94);
    color:rgba(255,255,255,0.85); font-size:10px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
    -webkit-app-region:no-drag;
  }
  .close:hover { background:#e0574a; color:#fff; }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot offline" id="statusDot"></span>
    <input id="input" type="text" placeholder="和澪说点什么…" autocomplete="off" spellcheck="false">
    <button type="button" class="ibtn" id="imgBtn" title="发送图片">&#128247;</button>
    <button type="button" class="send" id="sendBtn" disabled>发送</button>
    <button type="button" class="close" id="closeBtn" title="退出对话">&#10005;</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>
<script src="pet-chat-bar.js"></script>
</body>
</html>
