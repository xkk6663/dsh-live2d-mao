<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mio Live2D 桌宠</title>
    <link rel="stylesheet" href="./live2d-pet.css?v=20261026-chipsize" />
  </head>
  <body>
    <main id="pet-root" aria-label="Mio Live2D 桌宠">
      <canvas id="live2d-canvas"></canvas>
      <div id="loading" class="loading-state"><span></span><b>正在唤醒 Mio</b></div>
      <div id="error" class="error-state" hidden>
        <strong>形象加载失败</strong>
        <span id="error-message">请在 Agent 设置中切换形象</span>
      </div>
      <div id="activity-indicator" class="activity-indicator" title="Mio 当前状态"></div>
      <section id="speech-bubble" class="speech-bubble" aria-live="polite" hidden>
        <span id="speech-bubble-text"></span>
        <img id="speech-bubble-img" class="speech-bubble-img" alt="" hidden />
      </section>
      <!-- 7.6 横条：DSH 流式提示专用窗位（可拖动 + ✕ 可关）。
           属**核心 UI**：插件只能经 window.__mioPetStrip 访问，不得直接改这里的 DOM。
           与说话气泡互斥使用（流式走横条、说话走气泡，不再打架）。 -->
      <section id="pet-strip" class="pet-strip" aria-live="polite" hidden>
        <!-- 左右拉伸手柄：用户要求"流式气泡的左右大小应该可手动拉伸"（2026-10-17） -->
        <span class="pet-strip-grip grip-left" data-strip-grip="left" aria-hidden="true"></span>
        <!-- ★ B1 发送方标识（2026-10-19）：多会话并发时才显示（单会话始终隐藏），
             颜色由 session id 哈希生成，live2d-pet.js 的 __mioPetStrip 负责 setSender -->
        <span id="pet-strip-sender" class="pet-strip-sender" hidden></span>
        <span id="pet-strip-text"></span>
        <button id="pet-strip-close" class="pet-strip-close" type="button" title="关闭横条" aria-label="关闭横条">×</button>
        <span class="pet-strip-grip grip-right" data-strip-grip="right" aria-hidden="true"></span>
      </section>
      <nav id="context-menu" class="context-menu" hidden>
        <button type="button" data-action="chat">打开/关闭对话窗口</button>
        <button type="button" data-action="gallery">更换形象</button>
        <button type="button" data-action="size">调整大小</button>
        <button type="button" data-action="opacity">调整不透明度</button>
        <!-- DSH 专用化：「截图提问」已移除（依赖 /api/xiaozhi/vision，随小智插件阉割） -->
        <button type="button" data-action="speech-bubble">隐藏说话气泡</button>
        <!-- ★ 用户裁决：流式正文放进**横条**显示（气泡只显示工具状态）。
             故「流式气泡」与「横条」本是同一条通路，菜单合并为一个开关。
             data-action 仍为 stream-bubble，兼容既有引用与设置键 live2d_stream_text_enabled。 -->
        <button type="button" data-action="stream-bubble">隐藏流式提示</button>
        <button type="button" data-action="agent-badge">隐藏状态徽标</button>
        <!-- ★ A2 上下文压力（2026-10-20）：徽标里「上下文 N%」小药丸的开关，
             默认开；纯本机显示偏好（localStorage mio_ctx_meter_enabled）。 -->
        <button type="button" data-action="ctx-meter">隐藏上下文占用</button>
        <button type="button" data-action="agent">打开 Mio</button>
        <hr />
        <button type="button" data-action="close">关闭桌宠</button>
      </nav>
      <section id="size-panel" class="size-panel" hidden>
        <header id="size-panel-header"><strong>桌宠大小</strong><output id="size-value">150%</output></header>
        <input id="size-slider" type="range" min="80" max="240" step="1" value="150" aria-label="桌宠大小" />
      </section>
      <!-- ★ 调整不透明度（2026-10-17 复用「调整大小」的面板逻辑） -->
      <section id="opacity-panel" class="size-panel" hidden>
        <header id="opacity-panel-header"><strong>桌宠不透明度</strong><output id="opacity-value">100%</output></header>
        <input id="opacity-slider" type="range" min="10" max="100" step="5" value="100" aria-label="桌宠不透明度" />
      </section>
    </main>
    <script src="./libs/live2dcubismcore.min.js"></script>
    <script src="./libs/pixi.min.js"></script>
    <script src="./libs/cubism4.min.js"></script>
    <script src="./expression-utils.js?v=20260812-expression-v1"></script>
    <script src="./plugin-bus.js?v=20261025-market"></script>
    <!-- A 档能力：交互音效（内置默认片段 + 现场合成保底）+ 空闲自语内容池（数据驱动） -->
    <script src="./pet-sound.js?v=20261017-explicitclips"></script>
    <script src="./pet-idle-talk.js?v=20261015-a6"></script>
    <!-- M2：模型专属台词库（quotes/<modelId>.json 数据驱动；缺失自动回退通用池） -->
    <script src="./pet-quotes.js?v=20261019-alive2"></script>
    <!-- A7 角色图库：桌宠内直接浏览/更换 Live2D 形象（数据来自既有 models 接口） -->
    <script src="./pet-gallery.js?v=20261015-a6"></script>
    <!-- A组 渲染增强：随机图片池 + 泡泡图库（气泡皮肤） + 模块化泡泡系统（6 类模块） -->
    <script src="./pet-random-image.js?v=20261015-a15"></script>
    <script src="./pet-bubble-styles.js?v=20261019-styles4"></script>
    <!-- DSH 专用化（用户裁决 2026-10-17）：小智插件资源已整体删除 ——
           xiaozhi-plugin.js（小智挂载器）、pet-xz-audio.js（小智语音/口型）、
           xiaozhi/xiaozhi-chat.{html,js}（小智快速对话浮窗）。
         它们依赖的 /api/xiaozhi/* 后端路由已随插件阉割，保留只会持续 WS 重连失败。
         将来若要做 DSH 语音，应走**新的 DSH 插件通路**，不要复活这套小智实现。 -->
    <script src="./live2d-pet.js?v=20261026-chipui"></script>
  </body>
</html>
